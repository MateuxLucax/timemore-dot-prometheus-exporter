services:
  exporter:
    image: ghcr.io/mateuxlucax/timemore-dot-prometheus-exporter:latest
    # Or build from source instead:
    # build: .
    restart: unless-stopped
    environment:
      # A long random string, e.g. from `openssl rand -hex 32`. Put it in a .env file next
      # to docker-compose.yml (AUTH_TOKEN=...) and use the same token in the app.
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN to a long random string}
      REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      SYNC_INTERVAL: 15m
    volumes:
      - exporter-data:/data # SQLite, the source of truth: back this up
    ports:
      - "8080:8080"
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      # Default retention is only 15d; keep brew history for years.
      - --storage.tsdb.retention.time=10y
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # No published port: Prometheus has no authentication. For debugging, publish it on
    # localhost only:
    # ports:
    #   - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  exporter-data:
  prometheus-data:
  grafana-data:
